# Source and test directories
sonar.sources=src
sonar.tests=test

# Clojure source file extensions
sonar.clojure.file.suffixes=.clj,.cljs,.cljc

# Coverage report path (generated by cloverage)
sonar.clover.reportPath=build/reports/clover.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/test/**,**/*_test.clj,**/dev/**

# Test inclusions
sonar.test.inclusions=**/*_test.clj
